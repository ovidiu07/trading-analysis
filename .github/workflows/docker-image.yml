# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Build pushes on these branches and pull requests targeting main.
  push:
    branches:
      - "main"
      - "develop"
      - "redesign-upgraded-improved"
  pull_request:
    branches:
      - "main"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Deployment runs only after the build and image publishing succeed.
jobs:
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build with Maven
        working-directory: backend   # <-- folder where pom.xml is
        run: mvn clean package -DskipTests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Backend Docker image
        run: docker build --platform linux/amd64 -t marley2022/tradejaudit:audit-service ./backend

      - name: Build Frontend Docker image
        run: docker build --platform linux/amd64 -t marley2022/tradejaudit:frontend-service ./frontend

      - name: Push Backend Docker image
        if: github.event_name != 'pull_request'
        run: docker push marley2022/tradejaudit:audit-service

      - name: Push Frontend Docker image
        if: github.event_name != 'pull_request'
        run: docker push marley2022/tradejaudit:frontend-service

      - name: Final message
        run: echo Finished !

  deploy:
    name: Deploy after successful build
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/redesign-upgraded-improved'
    uses: ./.github/workflows/deploy-docker-images.yml
    secrets: inherit
